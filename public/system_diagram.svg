<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#1e293b" opacity="0.3"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1e293b" stroke-width="0.5" opacity="0.1"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#1e293b" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    <!-- Card Inner Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Gaps and Glows -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Arrow Head definition -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4ade80"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- 1. Background -->
  <rect width="1000" height="650" fill="#0b0f19" />
  <rect width="1000" height="650" fill="url(#grid)" />

  <!-- Title Block -->
  <text x="50" y="55" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="20" letter-spacing="4">⚡ WATTWATCH // SYSTEM_ARCHITECTURE</text>
  <text x="50" y="78" fill="#64748b" font-family="monospace" font-size="10" letter-spacing="2">EVENT-DRIVEN DIGITAL TWIN FLOW DIAGRAM</text>
  <line x1="50" y1="95" x2="950" y2="95" stroke="#1e293b" stroke-width="2"/>

  <!-- ==================== LAYER 1: SIMULATION ==================== -->
  <rect x="50" y="160" width="220" height="380" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="70" y="195" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="12" letter-spacing="1.5">SIMULATED DEVICE LAYER</text>
  
  <!-- Subcard A: Python Sim -->
  <rect x="70" y="220" width="180" height="110" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1.5"/>
  <text x="85" y="245" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">simulator.py (Python)</text>
  <text x="85" y="270" fill="#94a3b8" font-family="sans-serif" font-size="10">• Virtual Occupancy Loop</text>
  <text x="85" y="290" fill="#94a3b8" font-family="sans-serif" font-size="10">• Optional device toggles</text>
  <text x="85" y="310" fill="#94a3b8" font-family="sans-serif" font-size="10">• Delayed anomaly triggers</text>

  <!-- Subcard B: JS Simulator -->
  <rect x="70" y="355" width="180" height="110" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1.5"/>
  <text x="85" y="380" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">lib/db.ts (Fallback Sim)</text>
  <text x="85" y="405" fill="#94a3b8" font-family="sans-serif" font-size="10">• Runs inside Next.js node</text>
  <text x="85" y="425" fill="#94a3b8" font-family="sans-serif" font-size="10">• Generates baseline activity</text>
  <text x="85" y="445" fill="#94a3b8" font-family="sans-serif" font-size="10">• Fallback when python off</text>

  <!-- ==================== LAYER 2: BACKEND API ==================== -->
  <rect x="380" y="160" width="240" height="380" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="400" y="195" fill="#fb923c" font-family="sans-serif" font-weight="800" font-size="12" letter-spacing="1.5">NEXT.JS API BACKEND</text>

  <!-- Endpoints -->
  <rect x="400" y="220" width="200" height="160" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1.5"/>
  <text x="415" y="245" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">API Endpoints (TypeScript)</text>
  <text x="415" y="275" fill="#fb923c" font-family="monospace" font-size="10">GET/POST /api/devices</text>
  <text x="415" y="295" fill="#fb923c" font-family="monospace" font-size="10">GET/POST/DEL /api/alerts</text>
  <text x="415" y="315" fill="#fb923c" font-family="monospace" font-size="10">GET /api/usage</text>
  <text x="415" y="335" fill="#fb923c" font-family="monospace" font-size="10">GET /api/occupants</text>
  <text x="415" y="355" fill="#e2e8f0" font-family="monospace" font-size="10">GET /api/stream (SSE)</text>

  <!-- Database -->
  <rect x="400" y="400" width="200" height="110" rx="6" fill="#020617" stroke="#475569" stroke-width="2"/>
  <text x="455" y="430" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13">SQLite DB</text>
  <text x="430" y="455" fill="#64748b" font-family="monospace" font-size="10">wattwatch.db</text>
  <text x="415" y="480" fill="#4ade80" font-family="sans-serif" font-size="9" text-anchor="middle" x="500">SINGLE SOURCE OF TRUTH</text>

  <!-- ==================== LAYER 3: INTERFACES ==================== -->
  <!-- Web Dashboard -->
  <rect x="730" y="130" width="220" height="210" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="750" y="165" fill="#4ade80" font-family="sans-serif" font-weight="800" font-size="12" letter-spacing="1.5">WEB DASHBOARD</text>
  <rect x="750" y="190" width="180" height="120" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1.5"/>
  <text x="765" y="215" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold">React SPA (Next.js)</text>
  <text x="765" y="240" fill="#94a3b8" font-family="sans-serif" font-size="9">• 2D Floorplan Animations</text>
  <text x="765" y="260" fill="#94a3b8" font-family="sans-serif" font-size="9">• Real-Time SSE Updates</text>
  <text x="765" y="280" fill="#94a3b8" font-family="sans-serif" font-size="9">• Direct Device Control</text>
  <text x="765" y="300" fill="#94a3b8" font-family="sans-serif" font-size="9">• Occupants Directory</text>

  <!-- Discord Bot -->
  <rect x="730" y="370" width="220" height="210" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="750" y="405" fill="#818cf8" font-family="sans-serif" font-weight="800" font-size="12" letter-spacing="1.5">DISCORD BOT</text>
  <rect x="750" y="430" width="180" height="120" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1.5"/>
  <text x="765" y="455" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold">discord_bot.py (Python)</text>
  <text x="765" y="480" fill="#94a3b8" font-family="sans-serif" font-size="9">• Commands: !status, !usage</text>
  <text x="765" y="500" fill="#94a3b8" font-family="sans-serif" font-size="9">• Direct room control / stats</text>
  <text x="765" y="520" fill="#94a3b8" font-family="sans-serif" font-size="9">• List occupants directory</text>
  <text x="765" y="540" fill="#94a3b8" font-family="sans-serif" font-size="9">• Real-Time alerts via SSE</text>

  <!-- ==================== CONNECTIONS ==================== -->
  
  <!-- Connect Simulator -> Backend API -->
  <path d="M 270 275 L 372 275" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="320" y="260" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">HTTP POST</text>
  
  <path d="M 270 410 L 372 350" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="320" y="375" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">HTTP POST</text>

  <!-- Endpoints <-> SQLite -->
  <path d="M 470 380 L 470 392" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 530 400 L 530 388" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="500" y="394" fill="#4ade80" font-family="sans-serif" font-weight="bold" font-size="8" text-anchor="middle">SQL READ/WRITE</text>

  <!-- Backend API -> Web Dashboard (API request & SSE Stream) -->
  <path d="M 620 250 L 722 210" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="670" y="218" fill="#fb923c" font-family="monospace" font-size="9" text-anchor="middle">HTTP GET/POST</text>

  <path d="M 620 300 L 722 280" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,4" filter="url(#glowGreen)" marker-end="url(#arrowGreen)"/>
  <text x="670" y="275" fill="#4ade80" font-family="monospace" font-size="9" text-anchor="middle">SSE Stream (GET)</text>

  <!-- Backend API -> Discord Bot (API request & SSE Stream) -->
  <path d="M 620 460 L 722 470" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="670" y="455" fill="#fb923c" font-family="monospace" font-size="9" text-anchor="middle">HTTP GET</text>

  <path d="M 620 340 L 722 520" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,4" filter="url(#glowGreen)" marker-end="url(#arrowGreen)"/>
  <text x="670" y="405" fill="#4ade80" font-family="monospace" font-size="9" text-anchor="middle">SSE Alerts</text>

</svg>
